name: Auto Update Flight Prices

on:
  schedule:
    # ตั้งเวลาทำงานทุกวัน 05:00 UTC (ตรงกับ 12:00 น. เที่ยงวันในไทย)
    - cron: '0 5 * * *'
  workflow_dispatch: # ปุ่มสำหรับสั่งรันด้วยมือยามต้องการ

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run flight update script
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_flights.py
